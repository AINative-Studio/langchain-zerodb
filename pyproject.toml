[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "langchain-zerodb"
version = "0.1.0"
description = "LangChain vector store integration for ZeroDB — free embeddings, sub-millisecond semantic search"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "langchain-core>=0.1.0",
    "requests>=2.28.0",
]
keywords = ["langchain", "zerodb", "vector-store", "embeddings", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://ainative.studio"
Repository = "https://github.com/AINative-Studio/langchain-zerodb"
Documentation = "https://docs.ainative.studio"
